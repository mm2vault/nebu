# Render Blueprint for Nebu (paid plan with a persistent disk).
# On the free plan there is no disk: remove the `disk` block and DATA_DIR, keep plan: free,
# and use the encrypted GitHub snapshot backup instead (see README, SNAPSHOT_* variables).
services:
  - type: web
    name: nebu-bio
    runtime: node
    region: frankfurt
    plan: starter            # free plan has no persistent disk
    buildCommand: node --version
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data     # must match the disk mount path below
      # Optional GitHub snapshot backup (works with or without a disk). Secrets are set in the dashboard.
      - key: SNAPSHOT_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SNAPSHOT_KEY
        sync: false
    disk:
      name: nebu-data
      mountPath: /var/data
      sizeGB: 1
