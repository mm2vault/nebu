# Render Blueprint for Nebu.
# The SQLite database needs a persistent disk, and disks are only available on paid plans
# (starter or higher). On the free plan the database is wiped on every deploy/restart.
services:
  - type: web
    name: nebu-bio
    runtime: node
    region: frankfurt
    plan: starter            # free plan has no persistent disk
    buildCommand: node --version
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data     # must match the disk mount path below
    disk:
      name: nebu-data
      mountPath: /var/data
      sizeGB: 1
